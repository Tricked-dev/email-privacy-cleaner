# Example configuration for email-privacy-cleaner / email-privacy-milter.
#
# All keys are optional; the values shown are the built-in defaults.
# Load with:  --config /etc/email-privacy-cleaner/config.toml

# "enforce"   -> actually rewrite the message body.
# "report-only" -> compute and emit audit headers, but never modify the body.
mode = "enforce"

# --- What to clean -----------------------------------------------------------

# Rewrite text/html body parts.
clean_html = true

# Also strip tracking query params from text/plain parts (conservative;
# only obvious http(s) URLs are touched). Off by default.
clean_text_plain = false

# Remove likely tracking pixels / beacons from HTML.
remove_pixels = true

# Also neutralise tracking beacons hidden in CSS rather than an <img>: a
# `url(...)` in an inline style (background / background-image, ...) or the
# legacy `background="..."` attribute, when it points at a known beacon host or
# is fetched by a hidden / 1x1 element. Visible backgrounds on normal-sized
# elements are left alone. Only applies when remove_pixels is true.
neutralize_css_beacons = true

# Strip the hyperlink-auditing `ping` attribute from <a>/<area> tags so a click
# never fires a hidden background beacon to the listed URLs.
strip_link_ping = true

# Strip known tracking query parameters (utm_*, fbclid, gclid, ...).
# Entries in extra_tracking_params may end with '*' to match by prefix.
clean_query_params = true

# Apply host-specific (non-global) provider rules from the rule pack (Amazon
# `pf_rd_*`, YouTube `si`, eBay `_trkparms`, Twitter/X `s`/`t`, LinkedIn `trk`,
# ...). When false, only the global tracking params are stripped.
apply_vendor_rules = true

# Also strip referral-marketing params (provider `referralMarketing` rules).
# Off by default, since some recipients want affiliate/referral credit.
strip_referral_marketing = false

# Unwrap known ESP redirect links *offline* (SendGrid, Mailchimp, HubSpot, ...).
unwrap_known_redirects = true

# Preserve the pre-cleaning href in a `data-original-href` attribute. OFF by
# default: the attribute lives in the HTML body, so when a recipient *replies*
# their client quotes it and the original tracker leaks into the reply chain
# (along with the fact that this cleaner ran). Turn on only when you
# specifically want a per-link audit trail visible to the recipient.
preserve_original_href = false

# Debug only: keep removed elements as HTML comments instead of deleting them.
# Same reply-leak caveat as `preserve_original_href`: the comments are in the
# HTML body.
debug_preserve_removed = false

# --- Sender-aware behaviour --------------------------------------------------

# Protect built-in "sensitive" senders (identity providers, banks, payment and
# auth services). For matching From: domains, query-param cleaning and redirect
# unwrapping are skipped so magic-login / 2FA / reset links never break. Pixel
# removal still applies (always safe).
protect_sensitive_senders = true

# Surface the message's List-Unsubscribe HTTP(S) target as an
# X-Privacy-Cleaner-Unsubscribe header. The List-Unsubscribe link itself is
# always treated as sensitive and is never rewritten (its token is preserved).
surface_unsubscribe = true

# Per-sender policy overrides, evaluated in order (first match wins). Every
# toggle is optional and inherits the global value when omitted. `no_modify`
# forces report-only behaviour for that sender.
#
# [[sender_policies]]
# match_domains = ["bank.example", "accounts.example"]
# no_modify = true              # never rewrite the body for this sender
#
# [[sender_policies]]
# match_domains = ["newsletter.example"]
# unwrap_known_redirects = true
# remove_pixels = true

# --- Failure behaviour -------------------------------------------------------

# fail_open = true  -> on an internal parse error, pass the ORIGINAL message
#                      through and add an X-Privacy-Cleaner-Error header.
# fail_open = false -> tempfail (the MTA will retry later).
fail_open = true

# --- Resource limits (bounded memory / CPU) ----------------------------------

max_message_size = 52428800   # 50 MiB
max_html_part_size = 8388608  #  8 MiB
timeout_ms = 1500

# --- Optional network redirect resolver (PHASE 2 — OFF by default) -----------
#
# When enabled (requires building with `--features network`), redirects that
# could not be unwrapped offline may be resolved by following HTTP redirects.
# Strict SSRF protections always apply: only allowlisted redirector hosts are
# contacted, HEAD-first, no cookies, no auth, no JS, and private / loopback /
# link-local / metadata IPs are blocked. Off-allowlist final Location targets
# may be accepted after validation, but are not fetched. Max 5 hops.
network_redirect_resolution = false
allowlisted_redirect_domains = [
  # "links.trusted-esp.com",
]

# --- Customisation lists -----------------------------------------------------

# Links to these domains are neutralised (href set to about:blank). Suffix match.
blocked_domains = [
  # "malware.example",
]

# Extra tracking query params to strip, merged with the built-in list.
extra_tracking_params = [
  # "my_custom_tracker",
]

# Extra tracking-pixel host suffixes to drop, merged with the built-in list.
extra_pixel_domains = [
  # "beacon.mycorp.example",
]

# --- Exclusions (carve-outs that override the rule pack) ---------------------

# Query params that are NEVER stripped, even if a built-in/pack rule matches
# them. Case-insensitive; a trailing '*' matches by prefix.
keep_params = [
  # "ref",
  # "mc_*",
]

# Hosts left ENTIRELY untouched — no param stripping, no redirect unwrapping.
# Suffix match (so "intranet.example" also covers "*.intranet.example").
exclude_domains = [
  # "intranet.example",
]

# Rule-pack provider names to switch off (removed from the compiled ruleset).
disabled_providers = [
  # "amazon",
]

# --- External rule packs and format contract --------------------------------
#
# The built-in rules ship as a ClearURLs-format JSON document compiled into the
# binary (rules/builtin.json). You can layer additional ClearURLs-format packs
# on top — including the upstream ClearURLs data.min.json — to extend coverage
# without code changes. Loaded packs AUGMENT the built-ins (union of providers).
#
# The legacy string arrays below remain supported and mean ClearURLs JSON.
# Structured entries use `source`; `path` and `url` are accepted aliases.
# `format` is optional and accepts `auto`, `clear-urls`, `brave-clean-urls`,
# `brave-debounce`, or `adguard`. `usage` is optional and currently accepts
# only `mail-beacon`. The upstream data licences are ClearURLs Rules LGPL-3.0,
# Brave lists MPL-2.0, and the AdGuard corpus GPL-3.0.
#
# NOTE: the upstream ClearURLs Rules are copyleft (LGPL-3.0); this crate ships
# only the parser, not that data. Download it and point at it yourself if you
# want it.
# Patterns using regex features unsupported by Rust's linear-time engine are
# skipped individually; the rest of the pack still loads.
rule_packs = [
  # "/etc/email-privacy-cleaner/clearurls.data.min.json",
]

# Pack URLs. `file://` URLs and bare local paths are read offline in any build;
# `http(s)://` URLs are fetched once at startup and require the `network`
# feature. Rule-pack loading is startup-only: no pack URL is fetched during
# per-message cleaning. (The separate network redirect resolver is still an
# explicitly opt-in per-message feature.)
# Nix users can prefetch a remote pack into the store and reference it as a
# file:// path here — or, more idiomatically, via the module's `rulePacks`.
rule_pack_urls = [
  # "https://rules2.clearurls.xyz/data.min.json",   # needs the `network` feature
  # "file:///var/lib/email-privacy-cleaner/clearurls.json",  # offline
]

# Structured sources. Each distinct source is attempted once during startup;
# duplicate source strings are collapsed. No source is loaded per message.
# `source`, `path`, and `url` are equivalent field names.
#[[rule_pack_sources]]
#source = "/etc/email-privacy-cleaner/clearurls.json"
#format = "clear-urls"

#[[rule_pack_sources]]
#url = "https://example.invalid/adguard.txt"
#format = "adguard"
#usage = "mail-beacon"  # permits modifierless AdGuard image rules

# Resource bounds for structured and legacy external sources. Defaults:
# 5 MiB per source, 25 MiB total, 32 sources, 50,000 external rules,
# 10,000 regex rules, and 16 retained diagnostic samples per source.
#[rule_limits]
#max_rule_pack_bytes = 5242880
#max_total_rule_pack_bytes = 26214400
#max_rule_pack_sources = 32
#max_external_rules = 50000
#max_regex_rules = 10000
#max_diagnostic_samples = 16

# Tip: the CLI and milter also accept `--rule-pack <PATH>` (repeatable), which
# merges on top of these — handy with `--config` or a read-only config file.

# --- Milter daemon -----------------------------------------------------------

# TCP address the milter listens on (Stalwart connects here).
listen = "127.0.0.1:11333"
