name: docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "**.rs"
      - "**.toml"
      - "rules/**"
      - "Dockerfile*"
      - ".github/workflows/docker.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binaries
        run: cargo build --release --locked

      # Copy alongside Dockerfile.prebuild so the docker build context picks
      # them up.
      - name: Stage binaries for docker context
        run: cp target/release/email-privacy-milter target/release/email-privacy-cleaner .

      - name: Build and push
        uses: mr-smithers-excellent/docker-build-push@v6
        with:
          registry: ghcr.io
          image: email-privacy-cleaner
          dockerfile: Dockerfile.prebuild
          addLatest: ${{ github.ref == 'refs/heads/main' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: email-privacy-cleaner-linux-x86_64
          path: |
            email-privacy-milter
            email-privacy-cleaner
          if-no-files-found: error
