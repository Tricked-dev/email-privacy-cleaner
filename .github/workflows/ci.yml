name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cargo.toml declares rust-version = "1.75" (MSRV) — make sure that
        # contract holds, in addition to stable.
        toolchain: ["1.75", "stable"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry, index, and target
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache per toolchain to avoid cross-version artifact reuse.
          key: ${{ matrix.toolchain }}

      - name: cargo fmt --check
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build (default features)
        run: cargo build --locked --all-targets

      - name: cargo build (no-default-features, offline-only)
        run: cargo build --locked --no-default-features

      - name: cargo test (default features)
        run: cargo test --locked --all-features

      - name: cargo test (no-default-features)
        run: cargo test --locked --no-default-features
