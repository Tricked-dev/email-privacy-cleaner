name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel in-flight runs for the same ref when a newer commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (rust ${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Cargo.toml declares rust-version = "1.75" (MSRV) — make sure that
        # contract holds, in addition to stable.
        toolchain: ["1.75", "stable"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry, index, and target
        uses: Swatinem/rust-cache@v2
        with:
          # Separate cache per toolchain to avoid cross-version artifact reuse.
          key: ${{ matrix.toolchain }}

      - name: cargo fmt --check
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo build (default features)
        run: cargo build --locked --all-targets

      - name: cargo build (no-default-features, offline-only)
        run: cargo build --locked --no-default-features

      - name: cargo test (default features)
        run: cargo test --locked --all-features

      - name: cargo test (no-default-features)
        run: cargo test --locked --no-default-features

      - name: deterministic built-in rule statistics
        if: matrix.toolchain == 'stable'
        shell: bash
        run: |
          expected='ruleset: scopes=47 groups=169 exact_param_rules=163 prefix_param_rules=4 regex_param_rules=2 regex_set_chunks=1 domain_index_keys=0 beacon_rules=28 redirect_rules=19 raw_rules=0 providers=54'
          actual="$(cargo run --locked --no-default-features --quiet --bin email-privacy-cleaner -- rule-stats | sed -n '1p')"
          if [[ "$actual" != "$expected" ]]; then
            printf 'built-in rule statistics drifted:\nexpected: %s\nactual:   %s\n' "$expected" "$actual"
            exit 1
          fi

  nix-flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check flake without building outputs
        run: nix flake check --no-build
