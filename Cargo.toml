[package]
name = "email_privacy_cleaner"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Email privacy sanitizer library + milter daemon for Stalwart Mail Server. Strips tracking pixels, cleans tracking query params, and unwraps ESP redirect links offline."
license = "MIT OR Apache-2.0"
repository = "https://github.com/tricked-dev/email-privacy-cleaner"
readme = "README.md"
keywords = ["email", "milter", "privacy", "tracking", "stalwart"]
categories = ["email", "command-line-utilities"]

[lib]
name = "email_privacy_cleaner"
path = "src/lib.rs"

[[bin]]
name = "email-privacy-cleaner"
path = "src/bin/email-privacy-cleaner.rs"

[[bin]]
name = "email-privacy-milter"
path = "src/bin/email-privacy-milter.rs"

[features]
# `network` is on by default: it compiles in the (still runtime-opt-in) redirect
# resolver and HTTP(S) rule-pack fetching. Build with `--no-default-features`
# for a binary with no networking code at all (see the README note).
default = ["network"]
network = ["dep:ureq"]

[dependencies]
mail-parser = "0.11"
lol_html = "2"
url = "2"
percent-encoding = "2"
base64 = "0.22"
quoted_printable = "0.5"
encoding_rs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
regex-syntax = "0.8"
psl = "2.1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"

# Only pulled in when the `network` feature is enabled.
ureq = { version = "2", optional = true, default-features = false, features = ["tls"] }

[dev-dependencies]
# Used by the integration tests to build encoded fixtures and re-parse output.
url = "2"
mail-parser = "0.11"
base64 = "0.22"
quoted_printable = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
